# 끝장전·ASL 기록 자동 갱신 — GitHub 서버가 대신 돕니다 (PC 가 꺼져 있어도, 2026-09-15)
#
# 하는 일: 이 PC 작업 스케줄러 「SC Endgame Records Update」와 똑같이 tools/update.py 를 돌립니다
#   구글시트 → data/*.json → 사이트 빌드 → 카페24 FTP(pubgin.com/endgame) 업로드 → 슬랙 알림.
# 같은 시각(KST 21:30·01:30·05:30·09:30)에 PC 도 돌면 같은 파일을 같은 곳에 올릴 뿐이라 충돌하지 않습니다.
#
# 왜 되는가: 이 저장소는 공개라 Actions 분이 무료·무제한이고(비공개였던 예전 sc-endgame-src 는 월 2,000분에 막혔음),
#   카페24 FTP 가 2026-09-14 부터 해외 IP 를 허용해 GitHub 서버에서도 올라갑니다.
#
# Secrets (저장소 Settings → Secrets and variables → Actions) — 2026-09-15 API 로 등록:
#   SC_FTP_HOST · SC_FTP_USER · SC_FTP_PASS · SC_FTP_DIR   ← data/deploy.json 과 같은 값 (deploy.py 가 환경변수를 먼저 읽음)
#   YOUTUBE_API_KEY                                          ← data/youtube.json 의 apiKey (fetch_videos.py)
#   SLACK_WEBHOOK_URL                                        ← data/slack.json 의 webhookUrl (notify.py)
#
# 주의
#   · 저장소에 커밋하지 않습니다 — 원본은 구글시트이고 매번 다시 받으므로 남길 것이 없습니다. (PC 쪽 git 과 충돌 방지)
#   · data/.deploy-state.json(마지막으로 올린 파일의 해시)은 Actions 캐시로 이어갑니다 — 없으면 325개를 전부 다시 올립니다(~10분).
#   · update.py 는 기록이 줄면 스스로 멈춥니다(시트에서 줄이 지워지는 사고 방지). 그땐 PC 에서 9_삭제반영.bat.
#   · 공개 저장소라 실행 로그도 공개입니다 — 비밀값은 마스킹되고, 스크립트는 호스트 이름 외에 접속 정보를 찍지 않습니다.

name: 기록 자동 갱신

on:
  workflow_dispatch: {}
  schedule:                          # cron 은 UTC — KST = UTC+9. PC 스케줄러와 같은 시각.
    - cron: '30 12,16,20,0 * * *'    # KST 21:30 · 01:30 · 05:30 · 09:30

concurrency:
  group: sc-endgame-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: openpyxl (엑셀 산출물용 — 없으면 xlsx 만 건너뜀)
        run: pip install --quiet openpyxl

      # 지난 실행이 올린 파일 목록(해시)을 이어받습니다 — 바뀐 파일만 올리기 위해.
      - name: 배포 상태 이어받기
        uses: actions/cache@v4
        with:
          path: data/.deploy-state.json
          key: sc-deploy-state-${{ github.run_id }}
          restore-keys: |
            sc-deploy-state-

      - name: 시트 → 데이터 → 사이트 → 업로드
        env:
          SC_FTP_HOST: ${{ secrets.SC_FTP_HOST }}
          SC_FTP_USER: ${{ secrets.SC_FTP_USER }}
          SC_FTP_PASS: ${{ secrets.SC_FTP_PASS }}
          SC_FTP_DIR: ${{ secrets.SC_FTP_DIR }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PYTHONIOENCODING: utf-8
        run: python3 tools/update.py
