<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASL 기록실</title>
<meta name="description" content="ASL (AfreecaTV / SOOP 스타리그) 기록실 — 대회 23개, 매치 1,309, 세트 2,187, 선수 95명. 대국민 스타리그 ~ ASL Season 22. 역대 우승자·선수 랭킹·상대 전적·맵 통계를 한곳에서.">
<link rel="canonical" href="https://pubgin.com/endgame/asl/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스타크래프트 끝장전 기록실">
<meta property="og:title" content="ASL 기록실">
<meta property="og:description" content="ASL (AfreecaTV / SOOP 스타리그) 기록실 — 대회 23개, 매치 1,309, 세트 2,187, 선수 95명. 대국민 스타리그 ~ ASL Season 22. 역대 우승자·선수 랭킹·상대 전적·맵 통계를 한곳에서.">
<meta property="og:url" content="https://pubgin.com/endgame/asl/">
<meta property="og:image" content="https://stimg.sooplive.com/LOGO/ta/talent/m/talent.webp">
<meta name="twitter:card" content="summary">
<link rel="icon" href="https://stimg.sooplive.com/LOGO/ta/talent/m/talent.webp">
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#0a0d13; --panel:#141821; --panel2:#1b202b; --line:#232a38; --line2:#171c25;
  --txt:#e8ecf3; --dim:#8a93a6; --accent:#1c8cff; --gold:#ffb020;
  --win:#4ade80; --lose:#f87171;
  --t:#4a9eff; --p:#f5c518; --z:#ff6b6b;
}
*{box-sizing:border-box}
/* hidden 속성이 항상 이기도록. display 를 지정한 요소에 hidden 을 걸면
   작성자 규칙이 브라우저 기본값을 눌러 버려서 계속 보입니다. */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
  font-size:14px;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
/* 누르라고 만든 것들은 눌러도 글자가 잡히거나 커서가 깜빡이지 않게 합니다. */
.tab,.chip,th,.rowlink,.score-cell,.spoiler,.dlbtn,.backlink,.linkbtn,
.yt-mini,.vmodal-close,.navlink,.srow,.caret,.race,.rk{
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.rowlink,.score-cell,.tab,.chip,th[data-key]{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brandbar{height:4px;background:linear-gradient(90deg,var(--t) 0%,var(--accent) 35%,var(--gold) 70%,var(--z) 100%)}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

/* ── 헤더 ─────────────────────────────────────────── */
header{padding-bottom:18px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
header::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:repeating-linear-gradient(115deg,var(--accent) 0 2px,transparent 2px 26px);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
.headrow{display:flex;align-items:center;gap:14px;position:relative}
.brandlogo{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;
  border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(28,140,255,.15)}
h1{margin:0;font-size:26px;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;
  background-clip:text;color:transparent}
h1 a{color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:6px}
.stats-strip{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.stats-strip .item{color:var(--dim);font-size:12.5px}
.stats-strip b{color:var(--txt);font-size:15px;display:block;font-variant-numeric:tabular-nums}

/* ── 바로가기 배너 ────────────────────────────────── */
.linkbanner{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.linkbtn{display:flex;flex-direction:column;gap:2px;padding:9px 14px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px}
.linkbtn:hover{border-color:var(--accent)}
.linkbtn .sub2{color:var(--dim);font-weight:500;font-size:11px}
.linkbtn.yt:hover{border-color:#ff3d3d}
.yt-ico{color:#ff3d3d}

/* ── 라이브 배너 ──────────────────────────────────── */
.livecard{margin-top:14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);overflow:hidden}
.livecard.live{border-color:#ff3d3d;box-shadow:0 0 0 3px rgba(255,61,61,.10)}
.live-head{display:flex;align-items:center;gap:9px;padding:11px 14px;flex-wrap:wrap}
.live-dot{width:9px;height:9px;border-radius:50%;background:#ff3d3d;flex:none;
  box-shadow:0 0 0 0 rgba(255,61,61,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,61,61,0)}100%{box-shadow:0 0 0 0 rgba(255,61,61,0)}}
.live-badge{color:#ff3d3d;font-weight:900;font-size:12px;letter-spacing:.08em}
.live-title{font-weight:700;font-size:13.5px;flex:1;min-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-viewer{color:var(--dim);font-size:12px}
.live-off{padding:0 14px 12px;color:var(--dim);font-size:12.5px}
.live-off a{color:var(--accent);text-decoration:underline}
.live-thumb-link{display:block;position:relative}
.live-thumb{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
.live-play{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;font-weight:800;
  font-size:13px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82))}

/* ── 탭 / 칩 ──────────────────────────────────────── */
.tabs{display:flex;gap:6px;margin:20px 0 12px;flex-wrap:wrap}
.tab{padding:8px 15px;border-radius:8px;background:var(--panel);color:var(--dim);
  cursor:pointer;font-weight:600;font-size:13px;border:1px solid transparent}
.tab:hover{color:var(--txt)}
.tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),#0d5fc4);
  box-shadow:0 2px 10px rgba(28,140,255,.35)}
.tab .n{opacity:.6;margin-left:6px;font-size:11px}

.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.chip{padding:5px 12px;border-radius:999px;background:var(--panel);color:var(--dim);
  cursor:pointer;font-weight:700;font-size:12px;border:1px solid var(--line)}
.chip:hover{color:var(--txt)}
.chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.chiplabel{color:var(--dim);font-size:11.5px;letter-spacing:.05em;margin-right:2px}

input.search{width:100%;max-width:280px;padding:8px 12px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);color:var(--txt);
  font-size:13px;margin-bottom:12px}
input.search::placeholder{color:var(--dim)}
input.search:focus{outline:none;border-color:var(--accent)}

/* ── 표 ───────────────────────────────────────────── */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap}
th{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.06em;
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th.static{cursor:default}
td{border-bottom:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#161b25}
.num{text-align:right;font-variant-numeric:tabular-nums}
.rowlink{cursor:pointer}
.rk{display:inline-block;min-width:22px;color:var(--dim);font-size:12px;
  font-variant-numeric:tabular-nums}
.nm{font-weight:700}
.nm-link{font-weight:700;cursor:pointer;border-bottom:1px dotted transparent}
.nm-link:hover{color:var(--accent);border-bottom-color:var(--accent)}
.pct{color:var(--dim);font-size:12px;margin-left:4px}
.muted,.dim{color:var(--dim)}
.win{color:var(--win)}
.lose{color:var(--lose)}
.race{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;
  border-radius:5px;font-size:10.5px;font-weight:900;color:#0b0d11;margin-right:6px;flex:none}
.race.T{background:var(--t)} .race.P{background:var(--p)} .race.Z{background:var(--z)}

/* ── 카드 ─────────────────────────────────────────── */
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:14px;margin-bottom:14px}
.card > .tblwrap{border:none;border-radius:0;background:transparent}
.cardtitle{font-weight:800;font-size:14.5px;margin-bottom:10px;display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.cardtitle .note{color:var(--dim);font-weight:500;font-size:11.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}

/* ── 상성 막대 ────────────────────────────────────── */
.mubar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:6px 0 4px;
  background:var(--panel2)}
.mubar span{display:flex;align-items:center;justify-content:center;font-size:11px;
  font-weight:800;color:#0b0d11;min-width:0;overflow:hidden;white-space:nowrap}
.murow{margin-bottom:12px}
.murow:last-child{margin-bottom:0}
.mulabel{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.mulabel b{color:var(--txt)}

/* ── 스파크라인(연도별 사용) ──────────────────────── */
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px}
.spark i{display:block;width:5px;background:var(--accent);opacity:.55;border-radius:1px}
.spark i.on{opacity:1}

/* ── 내려받기 상자 (보조 기능이라 눈에 덜 띄게) ───── */
.dlbox{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:16px;
  padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);font-size:12px;opacity:.78}
.dlbox:hover{opacity:1}
.dlbox .t{color:var(--dim);font-size:11.5px;letter-spacing:.02em;margin-right:2px}
.dlbtn{padding:4px 10px;border-radius:6px;background:transparent;color:var(--dim);
  border:1px solid var(--line);font-weight:600;font-size:11.5px}
.dlbtn:hover{color:var(--txt);border-color:var(--accent)}
.dlbtn.on{color:var(--txt);border-color:var(--accent)}

/* ── 영상 ─────────────────────────────────────────── */
.yt-mini{color:#ff6b6b;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.yt-mini:hover{text-decoration:underline}
.yt-fallback{color:var(--dim);font-weight:600}
.vmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;
  align-items:center;justify-content:center;padding:20px}
.vmodal.on{display:flex}
.vmodal-box{width:100%;max-width:960px}
.vmodal-close{display:block;margin:0 0 10px auto;background:transparent;color:var(--txt);
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;
  font-size:13px;font-family:inherit}
.vmodal-frame{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.vmodal-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ── 스포일러 ─────────────────────────────────────── */
.score-cell{cursor:pointer}
.spoiler{display:inline-block;padding:3px 9px;border-radius:6px;background:var(--panel2);
  color:var(--dim);font-size:11.5px;font-weight:600;border:1px solid var(--line)}
.score-cell:hover .spoiler{color:var(--txt);border-color:var(--accent)}

/* ── 선수 페이지 ──────────────────────────────────── */
.backlink{color:var(--dim);font-size:13px;margin:16px 0 12px;display:inline-block;cursor:pointer}
.backlink:hover{color:var(--accent)}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead .race{width:26px;height:26px;line-height:26px;font-size:13px;border-radius:7px}
.pname{font-size:22px;font-weight:900;letter-spacing:-.01em}
.ptag{padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);font-size:11.5px;font-weight:700}
.streak-w{color:var(--win)} .streak-l{color:var(--lose)}

/* ── 푸터 ─────────────────────────────────────────── */
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--dim);font-size:12px;line-height:1.8}
footer a{color:var(--accent);text-decoration:underline}

/* ── 안내 문단 ────────────────────────────────────── */
.hint{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.7}
.emptybox{padding:26px 14px;text-align:center;color:var(--dim);font-size:13px}

/* ── 코드 (시트 연동 안내) ────────────────────────── */
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:11px 13px;overflow-x:auto;font-size:12.5px;margin:8px 0;color:#cfe6ff}
code.inline{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-size:12px;color:#cfe6ff}
ol.steps{padding-left:20px;line-height:2}
ol.steps li{margin-bottom:4px}

@media (max-width:640px){
  .wrap{padding:20px 13px 60px}
  h1{font-size:21px}
  .hide-mobile{display:none}
  th,td{padding:9px 9px}
  .stats-strip{gap:14px}
}

/* ── 사이트 전환 바 ───────────────────────────────── */
.sitenav{display:flex;gap:4px;margin:0 0 18px;flex-wrap:wrap}
.navlink{padding:7px 16px;border-radius:8px;background:var(--panel);color:var(--dim);
  font-weight:700;font-size:13px;border:1px solid var(--line)}
.navlink:hover{color:var(--txt);border-color:var(--accent)}
.navlink.on{color:#0b0d11;background:var(--gold);border-color:var(--gold)}

/* ── 펼쳐지는 대회 목록 (ASL) ─────────────────────── */
.tourlist{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.srow{display:grid;grid-template-columns:1fr 78px 78px 62px 224px 22px;
  align-items:center;gap:10px;padding:13px 14px;cursor:pointer;
  border-top:1px solid var(--line2)}
.srow:first-child{border-top:none}
.srow:hover{background:#161b25}
.srow.thead{background:transparent;border:none;cursor:default;padding:0 14px 8px;
  color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.06em}
.srow.thead:hover{background:none}
.srow .ch{font-size:12.5px;color:var(--dim);overflow:hidden;padding-left:14px;
  text-overflow:ellipsis;white-space:nowrap}
.caret{color:var(--dim);font-size:11px;text-align:center;transition:transform .15s}
.srow.open .caret{transform:rotate(90deg)}
.stages{display:none;background:#0f1319;border-top:1px solid var(--line2)}
.stages.open{display:block}
.stlabel{padding:13px 20px 2px;color:var(--dim);font-size:11.5px;letter-spacing:.06em}
.offbox{padding:12px 20px;border-bottom:1px solid var(--line2);font-size:12.5px}
.stages .tblwrap{border:none;background:transparent;border-radius:0}
.stages td{border-bottom:1px solid var(--line2)}

@media (max-width:760px){
  .srow{grid-template-columns:1fr 60px 60px 20px}
  .srow > :nth-child(4),.srow.thead > :nth-child(4){display:none}
  .srow .ch{display:none}
}

/* ── CG 제작 툴 ───────────────────────────────────── */
.cgwrap{max-width:none;padding:22px 22px 60px}
.cglayout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
.cgpanel{position:sticky;top:16px;max-height:calc(100vh - 40px);overflow-y:auto;
  padding-right:6px}
.cgpanel::-webkit-scrollbar{width:8px}
.cgpanel::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.cgstage{border:1px solid var(--line);border-radius:12px;background:#0e1015;padding:12px}
#cv{width:100%;height:auto;display:block;border-radius:6px;background:#15171c;
  cursor:grab;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#cv:active{cursor:grabbing}

.fld{margin-bottom:11px}
.fld > label{display:block;color:var(--dim);font-size:11.5px;font-weight:600;
  letter-spacing:.04em;margin-bottom:5px}
.fld input[type=text],.fld select,.fld textarea{width:100%;padding:8px 10px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  font-size:13px;font-family:inherit}
.fld textarea{min-height:96px;resize:vertical;line-height:1.6}
.fld input[type=text]:focus,.fld select:focus,.fld textarea:focus{
  outline:none;border-color:var(--accent)}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.fld input[type=color]{width:46px;height:32px;padding:2px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:9px}
/* CG 종류 고르기 */
.cgtypes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.cgtype{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  cursor:pointer;text-align:left;font-family:inherit}
.cgtype b{color:var(--txt);font-size:13px}
.cgtype span{font-size:10.5px;line-height:1.35}
.cgtype:hover{border-color:var(--accent)}
.cgtype.on{background:linear-gradient(135deg,var(--accent),#0d5fc4);border-color:var(--accent)}
.cgtype.on b,.cgtype.on span{color:#fff}
/* 글자 모양 한 줄 — 이름 / 크기 / 색 / 폰트 */
.strow{display:grid;grid-template-columns:1fr 66px 44px 104px;gap:6px;align-items:center;
  margin-bottom:6px}
.stname{color:var(--dim);font-size:11.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.strow input[type=number],.strow select{width:100%;padding:6px 7px;border-radius:7px;
  background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  font-family:inherit;font-size:12px}
.strow input[type=color]{width:100%;height:30px;padding:2px;border-radius:7px;
  background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.strow select:focus,.strow input:focus{border-color:var(--accent);outline:none}
.row-inline{display:flex;gap:9px;align-items:center}
.ovrow{display:flex;align-items:center;gap:6px;margin:6px 0}
.ovrow img{width:34px;height:34px;object-fit:contain;background:#20242e;border-radius:6px}
.ovrow input[type=range]{flex:1;min-width:60px}
.ovname{font-size:12px;color:#9aa3b5;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn{display:inline-block;padding:7px 11px;border-radius:7px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);font-size:12px;font-weight:600;cursor:pointer}
.filebtn:hover{color:var(--txt);border-color:var(--accent)}
.filebtn input{display:none}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--txt);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger:hover{border-color:var(--lose);color:var(--lose)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.note{color:var(--dim);font-size:11.5px;margin-top:8px;min-height:16px;line-height:1.6}
.note.bad{color:var(--gold)}
.helptxt{color:var(--dim);font-size:11.5px;line-height:1.75;margin-top:6px}
.helptxt code{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font-size:11px;color:#cfe6ff}

@media (max-width:1000px){
  .cglayout{grid-template-columns:1fr}
  .cgpanel{position:static;max-height:none}
}

/* ── 상대 전적 ─────────────────────────────────────────────── */
.h2hpanel{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:12px;margin-bottom:12px}
.h2hside{display:flex;flex-direction:column;gap:6px;flex:1 1 150px;min-width:0}
.h2hside.wide{flex:1 1 220px}
.h2hcap{font-size:11px;color:var(--dim)}
.h2hsel{width:100%;padding:8px 10px;border-radius:8px;font-size:13px;
  background:var(--panel2);color:var(--txt);border:1px solid var(--line);
  font-family:inherit;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238a93a6' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:10px;
  padding-right:26px}
.h2hsel:focus{border-color:var(--accent)}
/* 경기 기록을 대회·라운드로 묶을 때 그 사이에 끼우는 제목줄 */
.grouphead td{background:var(--panel2);border-top:2px solid var(--line);
  padding:9px 10px !important}
.grouphead .gtour{font-weight:700;color:var(--txt);font-size:13px}
.grouphead .ground{margin-left:8px;padding:2px 8px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);
  color:var(--accent);font-size:11px;font-weight:700}
.grouphead .note{margin-left:8px;color:var(--dim);font-size:11px;font-weight:500}
tbody tr.grouphead:first-child td{border-top:none}
/* 선수 칸 — 직접 치면 아래로 목록이 펼쳐집니다 (목록을 직접 그립니다). */
.h2hpick{position:relative}
.h2hinput{padding-right:30px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg fill='none' stroke='%238a93a6' stroke-width='1.6'%3E%3Ccircle cx='7' cy='7' r='4.2'/%3E%3Cpath d='M10.2 10.2L14 14' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E");
  background-size:13px}
.h2hclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;line-height:1;border:0;border-radius:6px;cursor:pointer;
  background:transparent;color:var(--dim);font-size:16px;font-family:inherit}
.h2hclear:hover{background:var(--panel);color:var(--txt)}
.h2hdrop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;
  max-height:264px;overflow-y:auto;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);
  box-shadow:0 12px 28px rgba(0,0,0,.45)}
.h2hopt{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
  font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}
.h2hopt:last-child{border-bottom:0}
.h2hopt:hover,.h2hopt.on{background:var(--panel)}
.h2hoptname{font-weight:600;color:var(--txt)}
.h2hoptrace{flex:0 0 auto;width:17px;height:17px;line-height:17px;text-align:center;
  border-radius:5px;font-size:10px;font-weight:800;color:#0b0d11}
.h2hoptrace.r-T{background:#7cc0ff}
.h2hoptrace.r-P{background:#ffd166}
.h2hoptrace.r-Z{background:#ff8fa3}
.h2hoptnum{margin-left:auto;color:var(--dim);font-size:11px}
.h2hempty{padding:12px 10px;color:var(--dim);font-size:12px;text-align:center}
.h2hvs{flex:0 0 auto;color:var(--dim);font-size:12px;font-weight:700;
  padding:0 2px 10px;align-self:flex-end}
.h2hreset{margin-bottom:0}
.h2hhead{text-align:center}
.h2hnames{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
  gap:8px;font-size:16px;font-weight:700}
.h2hvs2{color:var(--dim);font-size:12px;font-weight:400}
.h2hscore{display:flex;align-items:baseline;justify-content:center;gap:4px;
  margin-top:8px;font-size:26px;font-weight:800}
.h2hscore .dim{font-size:13px;font-weight:400}
.h2hdash{color:var(--dim);font-size:16px;margin:0 4px}
.h2hrate{margin-left:10px;font-size:15px;font-weight:700;color:var(--accent)}
.h2hbar{max-width:420px;margin:10px auto 4px}
.h2hbar span:first-child{background:var(--win)}
.h2hbar span:last-child{background:var(--lose)}
.h2hquick{justify-content:center;margin-top:8px}
@media (max-width:520px){
  .h2hvs{display:none}
  .h2hside{flex:1 1 100%}
  .h2hscore{font-size:22px}
}

/* 관리자(CG 제작) 입구 — 눈에 띄지 않게 맨 아래 구석에 둡니다. */
.gear{display:block;width:15px;height:15px;margin:14px auto 0;color:var(--line);
  opacity:.5;transition:opacity .15s,color .15s;-webkit-tap-highlight-color:transparent}
.gear:hover,.gear:focus-visible{opacity:1;color:var(--dim)}

/* 선수 사진 — img/players/<슬러그>.jpg 를 넣으면 자동으로 붙습니다. */
.pphoto{width:104px;height:104px;border-radius:50%;object-fit:cover;object-position:center top;
  border:3px solid var(--line);background:var(--panel2);flex:0 0 auto;
  box-shadow:0 4px 16px rgba(0,0,0,.35)}
.rphoto{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:center top;
  border:1px solid var(--line);background:var(--panel2);vertical-align:middle;margin-right:8px}

/* ── 모바일 터치 크기 ─────────────────────────────────
   손가락으로 누르는 화면입니다. 글자만 한 크기로 두면 잘 안 눌립니다.
   누르는 것들이 40px 안팎이 되도록 위아래 여백을 넉넉히 줍니다.

   이 블록은 **반드시 파일 맨 끝**에 있어야 합니다. 위쪽 @media 안에 두면
   그 뒤에 나오는 .navlink · .h2hsel 같은 규칙이 같은 우선순위로 다시
   덮어써서 효과가 사라집니다 (실제로 그렇게 겪었습니다).
   톱니바퀴(.gear)는 일부러 눈에 안 띄게 둔 것이라 건드리지 않습니다. */
@media (max-width:640px){
  .navlink{padding:11px 16px}
  .tab{padding:10px 14px}
  .chip{padding:9px 13px}
  .dlbtn{padding:9px 13px}
  .yt-mini{display:inline-block;padding:9px 4px}
  .backlink{padding:8px 2px}
  .nm-link{display:inline-block;padding:5px 0}
  .h2hsel{padding-top:11px;padding-bottom:11px}
  .h2hopt{padding:12px 10px}
  .h2hclear{width:34px;height:34px;font-size:19px}
  .h2hdrop{max-height:min(300px,46vh)}
}

/* 선수 사진은 얼굴이 보여야 하므로 큼직하게. 좁은 화면에서만 조금 줄입니다. */
@media (max-width:640px){
  .pphoto{width:78px;height:78px;border-width:2px}
  .rphoto{width:32px;height:32px}
}

/* CG 툴 — 넣고 빼기 체크칸 */
.checkrow{display:flex;flex-wrap:wrap;gap:10px 16px;margin:4px 0 8px}
.checkrow label{display:flex;align-items:center;gap:6px;color:var(--txt);
  font-size:12.5px;cursor:pointer;user-select:none}
.checkrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
</style>
</head>

/* ASL 기록실 — 허브 페이지 앱.
   끝장전과는 별개 대회라 데이터도 화면도 따로 씁니다.
   ASL 기록에는 날짜가 없고 대회·라운드만 있어서, 축은 '연도' 가 아니라 '대회' 입니다. */

var RACE_LABEL = { T: '테란', P: '프로토스', Z: '저그' };
var RACE_ORDER = ['T', 'P', 'Z'];
var MU_KEYS = ['PvT', 'TvZ', 'PvZ'];
var RACE_COLOR = { T: 'var(--t)', P: 'var(--p)', Z: 'var(--z)' };

function $(sel, el) { return (el || document).querySelector(sel); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function pct(w, l) { var t = w + l; return t ? (w / t * 100).toFixed(1) + '%' : '-'; }
function pctNum(w, l) { var t = w + l; return t ? w / t * 100 : 0; }
function raceBadge(r) { return '<span class="race ' + (r || '') + '">' + (r || '?') + '</span>'; }
function pageOf(slug) { return 'p/' + encodeURIComponent(slug) + '.html'; }
function nameLink(name, race, extraClass) {
  var s = D.slugs[name];
  var inner = (race ? raceBadge(race) : '') +
    '<span class="nm-link' + (extraClass ? ' ' + extraClass : '') + '">' + esc(name) + '</span>';
  return s ? '<a href="' + pageOf(s) + '">' + inner + '</a>' : inner;
}

var view = $('#view');
var tabsEl = $('#tabs');

$('#strip').innerHTML = [
  ['대회', D.global.totalTournaments + '개'],
  ['총 매치', D.global.totalMatches.toLocaleString()],
  ['총 세트', D.global.totalSets.toLocaleString()],
  ['참가 선수', D.global.totalPlayers + '명'],
  ['범위', D.global.firstTournament + ' ~ ' + D.global.lastTournament]
].map(function (kv) {
  return '<div class="item">' + kv[0] + '<b>' + kv[1] + '</b></div>';
}).join('');

var TABS = [
  { id: 'season', label: '대회' },
  { id: 'rank', label: '선수 랭킹' },
  { id: 'mu', label: '종족전 랭킹' },
  { id: 'roster', label: '선수 명단' },
  { id: 'maps', label: '맵 통계' },
  { id: 'matches', label: '경기 기록' },
  { id: 'h2h', label: '상대 전적' },
  { id: 'records', label: '기록실' }
];
var TAB_IDS = TABS.map(function (t) { return t.id; });

var state = {
  tab: 'season', tour: 'ALL', race: 'ALL', round: 'ALL', q: '', touchedTour: false,
  h2h: { pa: '', pb: '', ra: '', rb: '', map: '', tour: '' },
  mu: { my: 'T', op: 'Z', min: 10 },
  sort: { rank: { key: 'setWin', dir: -1 }, maps: { key: 'totalSets', dir: -1 } },
  open: {}
};
function sortState() { return state.sort[state.tab] || { key: '', dir: -1 }; }

function writeHash() {
  var h = state.tab + (state.tour !== 'ALL' ? '/' + encodeURIComponent(state.tour) : '');
  if (location.hash.replace(/^#/, '') !== h) history.replaceState(null, '', '#' + h);
}
function readHash() {
  var raw = location.hash.replace(/^#/, '');
  if (!raw) return;
  var parts = raw.split('/');
  if (TAB_IDS.indexOf(parts[0]) >= 0) state.tab = parts[0];
  if (parts[1]) {
    var want = decodeURIComponent(parts[1]);
    if (D.tournaments.some(function (t) { return t.name === want; })) {
      state.tour = want;
      state.touchedTour = true;
    }
  }
}

function renderTabs() {
  tabsEl.innerHTML = TABS.map(function (t) {
    return '<div class="tab' + (state.tab === t.id ? ' on' : '') + '" data-tab="' + t.id + '">' +
      t.label + '</div>';
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(function (el) {
    el.addEventListener('click', function () {
      state.tab = el.dataset.tab;
      state.q = '';
      render();
    });
  });
}

function tourChips() {
  var el = document.createElement('div');
  el.className = 'chips';
  el.innerHTML = '<span class="chiplabel">대회</span>' +
    '<div class="chip' + (state.tour === 'ALL' ? ' on' : '') + '" data-tour="ALL">전체</div>' +
    D.tournaments.map(function (t) {
      return '<div class="chip' + (state.tour === t.name ? ' on' : '') +
        '" data-tour="' + esc(t.name) + '">' + esc(t.short) + '</div>';
    }).join('');
  el.querySelectorAll('[data-tour]').forEach(function (c) {
    c.addEventListener('click', function () {
      state.tour = c.dataset.tour;
      state.touchedTour = true;      // 직접 고른 뒤로는 자동으로 안 바꿉니다
      render();
    });
  });
  return el;
}

function raceChips() {
  var el = document.createElement('div');
  el.className = 'chips';
  el.innerHTML = '<span class="chiplabel">종족</span>' +
    [['ALL', '전체']].concat(RACE_ORDER.map(function (r) { return [r, RACE_LABEL[r]]; }))
      .map(function (o) {
        return '<div class="chip' + (state.race === o[0] ? ' on' : '') +
          '" data-race="' + o[0] + '">' + o[1] + '</div>';
      }).join('');
  el.querySelectorAll('[data-race]').forEach(function (c) {
    c.addEventListener('click', function () { state.race = c.dataset.race; render(); });
  });
  return el;
}

function searchBox(placeholder, onInput) {
  var input = document.createElement('input');
  input.className = 'search';
  input.placeholder = placeholder;
  input.value = state.q;
  input.addEventListener('input', function () { state.q = input.value; onInput(); });
  return input;
}

function sortRows(rows, key, dir) {
  return rows.slice().sort(function (a, b) {
    var av = a[key], bv = b[key];
    if (typeof av === 'string' || typeof bv === 'string') {
      return String(av == null ? '' : av).localeCompare(String(bv == null ? '' : bv)) * dir;
    }
    return ((av || 0) - (bv || 0)) * dir;
  });
}

function tableHTML(cols, bodyHTML) {
  var s = sortState();
  return '<div class="tblwrap"><table><thead><tr>' + cols.map(function (c) {
    var arrow = c.key && s.key === c.key ? (s.dir > 0 ? ' ▲' : ' ▼') : '';
    return '<th class="' + (c.cls || '') + (c.key ? '' : ' static') + '"' +
      (c.key ? ' data-key="' + c.key + '"' : '') + '>' + c.label + arrow + '</th>';
  }).join('') + '</tr></thead><tbody>' + bodyHTML + '</tbody></table></div>';
}

function bindSort(container, rerender) {
  container.querySelectorAll('th[data-key]').forEach(function (el) {
    el.addEventListener('click', function () {
      var s = sortState(), k = el.dataset.key;
      if (s.key === k) s.dir *= -1;
      else { s.key = k; s.dir = k === 'name' ? 1 : -1; }
      rerender();
    });
  });
}

function mirrorNote(mirror, mirrorSets, totalSets) {
  if (!mirrorSets) return '';
  var parts = RACE_ORDER.filter(function (r) { return mirror[r]; })
    .map(function (r) { return RACE_LABEL[r] + ' ' + mirror[r]; });
  return '<div class="hint" style="margin-top:2px">위 막대는 서로 다른 종족끼리 붙은 ' +
    (totalSets - mirrorSets).toLocaleString() + '세트만 셉니다. ' +
    '동족전 ' + mirrorSets.toLocaleString() + '세트(' + parts.join(' · ') +
    ')는 이기고 지는 종족이 같아 상성에 넣지 않았습니다.</div>';
}

function muBar(key, o) {
  var front = key[0], back = key[2];
  var total = o.w + o.l;
  var wp = total ? o.w / total * 100 : 50;
  // 한쪽이 0이면 칸 너비가 0이라 글자가 밖으로 삐져나옵니다 — 좁으면 숨깁니다.
  var showL = total && wp >= 13, showR = total && (100 - wp) >= 13;
  return '<div class="murow">' +
    '<div class="mulabel"><span>' + raceBadge(front) + RACE_LABEL[front] +
    ' <b>' + o.w + '</b></span>' +
    '<span><b>' + o.l + '</b> ' + RACE_LABEL[back] + raceBadge(back) + '</span></div>' +
    '<div class="mubar">' +
    '<span style="width:' + wp + '%;background:' + RACE_COLOR[front] + '">' +
    (showL ? pct(o.w, o.l) : '') + '</span>' +
    '<span style="width:' + (100 - wp) + '%;background:' + RACE_COLOR[back] + '">' +
    (showR ? pct(o.l, o.w) : '') + '</span></div></div>';
}

/* ── 대회 ──────────────────────────────────────────────────── */
function renderSeason() {
  var html = D.tournaments.map(function (t) {
    var isOpen = !!state.open[t.name];
    var champ = t.champion
      ? '🏆 ' + nameLink(t.champion, t.championRace) +
        ' <span class="dim">' + t.finalScore + '</span>'
      : '<span class="dim">진행 중</span>';
    var head = '<div class="srow' + (isOpen ? ' open' : '') + '" data-t="' + esc(t.name) + '">' +
      '<span class="nm">' + esc(t.name) + '</span>' +
      '<span class="num dim">' + t.matches + '매치</span>' +
      '<span class="num dim">' + t.sets + '세트</span>' +
      '<span class="num dim">' + t.players + '명</span>' +
      '<span class="ch">' + champ + '</span>' +
      '<span class="caret">▶</span></div>';

    var rounds = '<div class="stlabel">라운드</div>' +
      '<div class="tblwrap" style="border:none;background:transparent"><table><tbody>' +
      t.rounds.map(function (r) {
        return '<tr><td class="nm" style="padding-left:20px">' + esc(r.name) + '</td>' +
          '<td class="num dim">' + r.matches + '매치</td>' +
          '<td class="num dim">' + r.sets + '세트</td></tr>';
      }).join('') + '</tbody></table></div>';

    var runner = t.runnerUp
      ? '<div class="offbox"><span class="dim">준우승</span> ' +
        nameLink(t.runnerUp, t.runnerUpRace) + '</div>'
      : '';
    var mu = '<div class="stlabel">종족 상성 (세트)</div><div style="padding:4px 20px 14px">' +
      MU_KEYS.map(function (k) { return muBar(k, t.mu[k]); }).join('') +
      mirrorNote(t.mirror, t.mirrorSets, t.sets) + '</div>';
    var go = '<div style="padding:14px 20px 4px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<a class="dlbtn on" href="t/' + encodeURIComponent(t.id) + '.html">' +
      '대회 상세 보기 →</a>' +
      '<span class="dlbtn" data-go="' + esc(t.name) + '">경기 기록에서 보기</span></div>';

    return head + '<div class="stages' + (isOpen ? ' open' : '') + '">' +
      go + runner + rounds + mu + '</div>';
  }).join('');

  view.innerHTML = '<div class="srow thead"><span>대회</span><span class="num">매치</span>' +
    '<span class="num">세트</span><span class="num">선수</span><span>우승</span><span></span></div>' +
    '<div class="tourlist">' + html + '</div>' +
    '<div class="hint">대회 줄을 누르면 펼쳐지고, 그 안의 <b>대회 상세 보기</b>를 누르면 ' +
    '진출 현황·라운드별 경기·선수 성적을 한 화면에서 볼 수 있습니다.<br>' +
    'ASL 기록에는 날짜가 없어 대회·라운드 순서로만 정리했습니다.</div>';

  view.querySelectorAll('[data-t]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      if (ev.target.closest('a') || ev.target.closest('[data-go]')) return;
      var n = el.dataset.t;
      state.open[n] = !state.open[n];
      render();
    });
  });
  view.querySelectorAll('[data-go]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      state.tour = el.dataset.go;
      state.touchedTour = true;
      state.tab = 'matches';
      render();
    });
  });
}

/* ── 선수 랭킹 ─────────────────────────────────────────────── */
function playerRows() {
  return D.players.map(function (p) {
    var src = state.tour === 'ALL' ? p : (p.byTour[state.tour] || null);
    if (!src) return null;
    return {
      name: p.name, slug: p.slug, race: p.race,
      titles: state.tour === 'ALL' ? p.titles : (D.champOf[state.tour] === p.name ? 1 : 0),
      setWin: src.setWin, setLoss: src.setLoss,
      matchWin: src.matchWin, matchLoss: src.matchLoss,
      tournaments: state.tour === 'ALL' ? p.tournaments : 1,
      best: state.tour === 'ALL' ? (p.bestRound || '') : (src.best || ''),
      setPct: pctNum(src.setWin, src.setLoss),
      matchPct: pctNum(src.matchWin, src.matchLoss)
    };
  }).filter(Boolean);
}

function renderRank() {
  view.appendChild(tourChips());
  view.appendChild(raceChips());
  var table = document.createElement('div');
  view.appendChild(searchBox('선수 이름 검색...', function () { draw(); }));
  view.appendChild(table);

  function draw() {
    var s = sortState();
    var rows = playerRows().filter(function (p) {
      return (state.race === 'ALL' || p.race === state.race) &&
        (!state.q || p.name.indexOf(state.q) >= 0);
    });
    rows = sortRows(rows, s.key, s.dir);
    var cols = [
      { key: 'name', label: '선수' },
      { key: 'titles', label: '우승', cls: 'num' },
      { key: 'matchWin', label: '매치', cls: 'num' },
      { key: 'matchPct', label: '매치 승률', cls: 'num' },
      { key: 'setWin', label: '세트', cls: 'num' },
      { key: 'setPct', label: '세트 승률', cls: 'num' },
      { key: 'tournaments', label: '출전 대회', cls: 'num hide-mobile' },
      { key: 'best', label: '최고 성적', cls: 'hide-mobile' }
    ];
    var body = rows.length ? rows.map(function (p, i) {
      return '<tr class="rowlink" data-href="' + pageOf(p.slug) + '">' +
        '<td><span class="rk">' + (i + 1) + '</span>' + raceBadge(p.race) +
        '<span class="nm">' + esc(p.name) + '</span></td>' +
        '<td class="num">' + (p.titles ? '🏆 ' + p.titles : '<span class="dim">-</span>') + '</td>' +
        '<td class="num">' + p.matchWin + '-' + p.matchLoss + '</td>' +
        '<td class="num">' + pct(p.matchWin, p.matchLoss) + '</td>' +
        '<td class="num">' + p.setWin + '-' + p.setLoss + '</td>' +
        '<td class="num">' + pct(p.setWin, p.setLoss) + '</td>' +
        '<td class="num hide-mobile">' + p.tournaments + '</td>' +
        '<td class="hide-mobile dim">' + esc(p.best || '-') + '</td></tr>';
    }).join('') : '<tr><td colspan="8"><div class="emptybox">해당 조건의 선수가 없습니다.</div></td></tr>';

    table.innerHTML = tableHTML(cols, body) +
      '<div class="hint">' +
      (state.tour === 'ALL' ? '통산 기록입니다. ' : esc(state.tour) + ' 기록만 보고 있습니다. ') +
      '"최고 성적"은 그 대회에서 올라간 가장 높은 라운드입니다.</div>';
    bindSort(table, draw);
    table.querySelectorAll('[data-href]').forEach(function (el) {
      el.addEventListener('click', function () { location.href = el.dataset.href; });
    });
  }
  draw();
}

/* ── 선수 명단 ─────────────────────────────────────────────── */
function renderRoster() {
  var grid = document.createElement('div');
  grid.className = 'grid3';
  RACE_ORDER.forEach(function (race) {
    var list = D.players.filter(function (p) { return p.race === race; })
      .sort(function (a, b) { return (b.titles - a.titles) || (b.setWin - a.setWin); });
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="cardtitle">' + raceBadge(race) + RACE_LABEL[race] +
      '<span class="note">' + list.length + '명</span></div>' +
      '<div class="tblwrap"><table><thead><tr><th class="static">선수</th>' +
      '<th class="static num">우승</th><th class="static num">세트</th></tr></thead><tbody>' +
      list.map(function (p) {
        return '<tr class="rowlink" data-href="' + pageOf(p.slug) + '">' +
          '<td class="nm">' + esc(p.name) + '</td>' +
          '<td class="num">' + (p.titles ? '🏆 ' + p.titles : '<span class="dim">-</span>') + '</td>' +
          '<td class="num">' + p.setWin + '-' + p.setLoss + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    grid.appendChild(card);
  });
  view.appendChild(grid);
  grid.querySelectorAll('[data-href]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.href; });
  });
}

/* ── 맵 통계 ───────────────────────────────────────────────── */
function renderMaps() {
  var table = document.createElement('div');
  view.appendChild(tourChips());
  view.appendChild(searchBox('맵 이름 검색...', function () { draw(); }));
  view.appendChild(table);

  function draw() {
    var s = sortState();
    var rows = D.maps;
    if (state.tour !== 'ALL') {
      rows = rows.filter(function (m) { return m.byTour[state.tour]; })
        .map(function (m) {
          var c = Object.assign({}, m);
          c.totalSets = m.byTour[state.tour];
          c.scoped = true;
          return c;
        });
    }
    if (state.q) {
      var q = state.q.toLowerCase();
      rows = rows.filter(function (m) { return m.name.toLowerCase().indexOf(q) >= 0; });
    }
    rows = sortRows(rows, s.key, s.dir);
    var scoped = state.tour !== 'ALL';
    var cols = [
      { key: 'name', label: '맵' },
      { key: 'totalSets', label: scoped ? '이 대회 세트' : '총 세트', cls: 'num' },
      { key: 'tournaments', label: '사용 대회', cls: 'num hide-mobile' },
      { key: 'mirrorSets', label: '동족전', cls: 'num hide-mobile' },
      { label: '프로토스 vs 테란', cls: 'num' },
      { label: '테란 vs 저그', cls: 'num' },
      { label: '프로토스 vs 저그', cls: 'num' }
    ];
    function cell(o, front) {
      if (!o || !(o.w + o.l)) return '<span class="dim">-</span>';
      return o.w + '-' + o.l + ' <span class="pct">(' + front + ' ' + pct(o.w, o.l) + ')</span>';
    }
    var body = rows.map(function (m) {
      return '<tr><td class="nm">' + esc(m.name) + '</td>' +
        '<td class="num">' + m.totalSets + '</td>' +
        '<td class="num hide-mobile">' + m.tournaments + '</td>' +
        '<td class="num hide-mobile dim">' + (m.mirrorSets || 0) + '</td>' +
        '<td class="num">' + cell(m.mu.PvT, 'P') + '</td>' +
        '<td class="num">' + cell(m.mu.TvZ, 'T') + '</td>' +
        '<td class="num">' + cell(m.mu.PvZ, 'P') + '</td></tr>';
    }).join('');
    table.innerHTML = tableHTML(cols, body) +
      '<div class="hint">괄호 안은 앞에 적힌 종족 기준 승률입니다. ' +
      '"동족전"은 같은 종족끼리 붙어 상성에 넣을 수 없는 세트 수입니다.' +
      (scoped ? ' 세트 수는 ' + esc(state.tour) + ' 것만 세지만, 승패는 통산 기준입니다.' : '') +
      '</div>';
    bindSort(table, draw);
  }
  draw();
}

/* ── 경기 기록 ─────────────────────────────────────────────── */
function renderMatches() {
  // 1,299매치를 한 번에 늘어놓으면 보기 어렵습니다. 처음 들어오면 최신 대회만 봅니다.
  if (!state.touchedTour && state.tour === 'ALL' && D.tournaments.length) {
    state.tour = D.tournaments[0].name;
  }
  view.appendChild(tourChips());
  var roundRow = document.createElement('div');
  roundRow.className = 'chips';
  view.appendChild(roundRow);
  var table = document.createElement('div');
  view.appendChild(searchBox('선수 이름으로 경기 찾기...', function () { draw(); }));
  view.appendChild(table);

  function drawRounds(list) {
    var seen = [];
    list.forEach(function (m) { if (seen.indexOf(m.round) < 0) seen.push(m.round); });
    seen.sort(function (a, b) {
      return D.roundOrder.indexOf(a) - D.roundOrder.indexOf(b);
    });
    if (seen.indexOf(state.round) < 0) state.round = 'ALL';
    roundRow.innerHTML = '<span class="chiplabel">라운드</span>' +
      [['ALL', '전체']].concat(seen.map(function (r) { return [r, r]; })).map(function (o) {
        return '<div class="chip' + (state.round === o[0] ? ' on' : '') +
          '" data-round="' + esc(o[0]) + '">' + esc(o[1]) + '</div>';
      }).join('');
    roundRow.querySelectorAll('[data-round]').forEach(function (c) {
      c.addEventListener('click', function () { state.round = c.dataset.round; draw(); });
    });
  }

  function draw() {
    var byTour = D.matches.filter(function (m) {
      return state.tour === 'ALL' || m.tournament === state.tour;
    });
    drawRounds(byTour);
    var rows = byTour.filter(function (m) {
      return (state.round === 'ALL' || m.round === state.round) &&
        (!state.q || m.players.some(function (n) { return n.indexOf(state.q) >= 0; }));
    });

    // ASL 기록에는 날짜가 없습니다. 그래서 같은 대회·같은 라운드에서 치른
    // 경기를 한 덩어리로 묶어 보여 줍니다 — 방송 한 회차에 해당하는 단위입니다.
    var tourAt = {};
    D.tournaments.forEach(function (t, i) { tourAt[t.name] = i; });
    rows = rows.slice().sort(function (x, y) {
      return (tourAt[x.tournament] - tourAt[y.tournament]) ||
        (D.roundOrder.indexOf(x.round) - D.roundOrder.indexOf(y.round)) ||
        (x.no - y.no);
    });

    var body = '', lastKey = null, groups = 0;
    rows.forEach(function (m) {
      var key = m.tournament + ' · ' + m.round;
      if (key !== lastKey) {
        lastKey = key;
        groups++;
        var n = rows.filter(function (z) {
          return z.tournament === m.tournament && z.round === m.round;
        }).length;
        body += '<tr class="grouphead"><td colspan="3">' +
          '<span class="gtour">' + esc(m.tournament) + '</span>' +
          '<span class="ground">' + esc(m.round) + '</span>' +
          '<span class="note">' + n + '매치</span></td></tr>';
      }
      var a = m.players[0], b = m.players[1];
      var aWin = m.winner === a;
      body += '<tr>' +
        '<td>' + nameLink(a, m.race[a]) + ' <span class="muted">vs</span> ' +
        nameLink(b, m.race[b]) + '</td>' +
        '<td class="num score-cell" data-awin="' + (aWin ? 1 : 0) + '">' +
        '<span class="spoiler">결과 보기</span>' +
        '<span class="score-value" hidden>' + m.setWins[a] + ' - ' + m.setWins[b] + '</span></td>' +
        '<td class="hide-mobile muted" style="white-space:normal">' +
        esc((m.maps || []).filter(Boolean).join(', ')) + '</td></tr>';
    });
    if (!rows.length) {
      body = '<tr><td colspan="3"><div class="emptybox">해당 조건의 경기가 없습니다.</div></td></tr>';
    }

    table.innerHTML = tableHTML([
      { label: '대진' }, { label: '결과', cls: 'num' }, { label: '맵', cls: 'hide-mobile' }
    ], body) +
      '<div class="hint">' + rows.length + '매치를 ' + groups + '개 라운드로 묶어 보고 있습니다. ' +
      'ASL 기록에는 날짜가 없어 대회·라운드 순서로 정리합니다. ' +
      '한 줄이 매치(시리즈) 하나이고, 맵은 그 시리즈에서 치른 순서대로입니다. ' +
      '"결과 보기"를 눌러야 스코어가 나옵니다.</div>';

    table.querySelectorAll('.score-cell').forEach(function (cellEl) {
      cellEl.addEventListener('click', function () {
        cellEl.querySelector('.spoiler').hidden = true;
        cellEl.querySelector('.score-value').hidden = false;
        var aWin = cellEl.dataset.awin === '1';
        var links = cellEl.closest('tr').querySelectorAll('.nm-link');
        if (links[0]) links[0].classList.add(aWin ? 'win' : 'lose');
        if (links[1]) links[1].classList.add(aWin ? 'lose' : 'win');
      });
    });
  }
  draw();
}

/* ── 기록실 ────────────────────────────────────────────────── */

/* ── 종족전 랭킹 ───────────────────────────────────────────────
   "테란 선수들 중 저그전을 잘하는 순서" — 종족 × 상대 종족 승률 순위.
   종족은 세트에 적힌 종족 기준이라 랜덤 출전도 그 세트의 종족으로
   집계됩니다. 동족전(테란의 테란전)도 그대로 셉니다. */
function muChips(label, key, opts) {
  var el = document.createElement('div');
  el.className = 'chips';
  el.innerHTML = '<span class="chiplabel">' + label + '</span>' +
    opts.map(function (o) {
      return '<div class="chip' + (String(state.mu[key]) === String(o[0]) ? ' on' : '') +
        '" data-v="' + o[0] + '">' + o[1] + '</div>';
    }).join('');
  el.querySelectorAll('[data-v]').forEach(function (c) {
    c.addEventListener('click', function () {
      state.mu[key] = (key === 'min') ? +c.dataset.v : c.dataset.v;
      render();
    });
  });
  return el;
}

function muRows() {
  var myI = SL.races.indexOf(state.mu.my);
  var opI = state.mu.op === 'ALL' ? -1 : SL.races.indexOf(state.mu.op);
  var tourI = state.tour === 'ALL' ? -1 :
    D.tournaments.map(function (t) { return t.name; }).indexOf(state.tour);
  var acc = {};
  function hit(pi, win) {
    var a = acc[pi] || (acc[pi] = { w: 0, l: 0 });
    if (win) a.w++; else a.l++;
  }
  SL.rows.forEach(function (r) {
    if (tourI >= 0 && r[3] !== tourI) return;
    if (r[5] === myI && (opI < 0 || r[6] === opI)) hit(r[0], r[7] === 0);
    if (r[6] === myI && (opI < 0 || r[5] === opI)) hit(r[1], r[7] === 1);
  });
  return Object.keys(acc).map(function (k) {
    var p = D.players[+k], a = acc[k];
    return { name: p.name, slug: p.slug, race: p.race,
             w: a.w, l: a.l, sets: a.w + a.l, rate: pctNum(a.w, a.l) };
  }).filter(function (r) { return r.sets >= state.mu.min; })
    .sort(function (x, y) { return y.rate - x.rate || y.sets - x.sets; });
}

function renderMu() {
  view.appendChild(tourChips());
  var R = [['T', '테란'], ['P', '프로토스'], ['Z', '저그']];
  view.appendChild(muChips('선수 종족', 'my', R));
  view.appendChild(muChips('상대 종족', 'op', R.concat([['ALL', '전체 상대']])));
  view.appendChild(muChips('최소 세트', 'min',
    [[5, '5세트+'], [10, '10세트+'], [20, '20세트+'], [30, '30세트+']]));

  var rows = muRows();
  var head = document.createElement('div');
  head.className = 'note';
  head.innerHTML = '<b>' + esc(RACE_LABEL[state.mu.my]) + '</b> 선수들의 <b>' +
    (state.mu.op === 'ALL' ? '전체 상대' : esc(RACE_LABEL[state.mu.op]) + '전') +
    '</b> 승률 순위 — ' + rows.length + '명 (세트 ' + state.mu.min + '개 이상, 승률순)';
  view.appendChild(head);

  var table = document.createElement('div');
  var body = rows.length ? rows.map(function (p, i) {
    var barW = Math.round(p.rate);
    return '<tr class="rowlink" data-href="' + pageOf(p.slug) + '">' +
      '<td><span class="rk">' + (i + 1) + '</span>' + raceBadge(p.race) +
      '<span class="nm">' + esc(p.name) + '</span></td>' +
      '<td class="num">' + p.w + '-' + p.l + '</td>' +
      '<td class="num"><b>' + pct(p.w, p.l) + '</b></td>' +
      '<td class="num">' + p.sets + '</td>' +
      '<td class="hide-mobile"><div style="height:8px;border-radius:4px;background:#232a38;overflow:hidden">' +
      '<div style="height:100%;width:' + barW + '%;background:linear-gradient(90deg,#22c55e,#4ade80)"></div>' +
      '</div></td></tr>';
  }).join('') :
    '<tr><td colspan="5" class="dim" style="text-align:center;padding:26px 0">' +
    '조건에 맞는 선수가 없습니다 — 최소 세트를 낮춰 보세요.</td></tr>';
  table.innerHTML = '<div class="tablewrap"><table><thead><tr>' +
    '<th>선수</th><th class="num">승-패</th><th class="num">승률</th>' +
    '<th class="num">세트</th><th class="hide-mobile" style="min-width:120px"></th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
  view.appendChild(table);
  table.querySelectorAll('[data-href]').forEach(function (el) {
    el.addEventListener('click', function () { location.href = el.dataset.href; });
  });

  var note = document.createElement('div');
  note.className = 'note';
  note.textContent = '종족은 각 세트에 적힌 종족 기준입니다 — 랜덤 출전 선수는 그 세트의 종족으로 집계되고, 동족전도 포함됩니다.';
  view.appendChild(note);
}

/* ── 상대 전적 ─────────────────────────────────────────────── */
/* 세트 한 줄 = [a, b, map, tour, round, aRace, bRace, winner]
   a·b·map·tour 는 D.players / D.maps / D.tournaments 의 자리 번호,
   winner 는 0 이면 a 가, 1 이면 b 가 이긴 세트입니다. */
var SL = D.setList || { races: ['T', 'P', 'Z'], rounds: [], rows: [] };

// 선수 고르는 목록은 가나다순 — 95명이라 이름 순서로 놓아야 찾기 쉽습니다.
var H2H_ORDER = D.players.map(function (p, i) { return i; }).sort(function (x, y) {
  return D.players[x].name.localeCompare(D.players[y].name, 'ko');
});

function h2hSel(name, value, opts, placeholder) {
  return '<select class="h2hsel" data-f="' + name + '">' +
    '<option value="">' + placeholder + '</option>' +
    opts.map(function (o) {
      return '<option value="' + o[0] + '"' +
        (String(o[0]) === String(value) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select>';
}

function h2hPlayerOpts() {
  return H2H_ORDER.map(function (i) {
    var p = D.players[i];
    return [i, p.name + ' (' + p.race + ')'];
  });
}

/* 선수 고르는 칸.
   브라우저 기본 <datalist> 를 쓰다가 한글 입력에서 말썽이 났습니다 — 한글은
   글자를 조합하는 동안(ㄱ→기→김) 값이 계속 바뀌는데, 크롬의 기본 목록이 그
   조합 중인 값과 잘 안 맞아 이름을 다 쳐도 목록이 비는 일이 있었습니다.
   그래서 목록을 직접 그립니다. 조합이 끝나는 순간까지 챙겨서 다시 거릅니다. */

var CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ',
           'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];

/** '김택용' → 'ㄱㅌㅇ'. 초성만 쳐도 찾히게 하려는 것입니다. */
function chosung(s) {
  var out = '', i, c;
  for (i = 0; i < s.length; i++) {
    c = s.charCodeAt(i);
    out += (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : s.charAt(i);
  }
  return out;
}

function h2hPlayerLabel(i) {
  var p = D.players[i];
  return p ? p.name + ' (' + p.race + ')' : '';
}

/** 친 글자에 맞는 선수 번호들. 빈 칸이면 전체(가나다순). */
function h2hMatches(q) {
  var t = (q || '').trim();
  if (!t) return H2H_ORDER.slice();
  var onlyCho = /^[ㄱ-ㅎ]+$/.test(t);
  return H2H_ORDER.filter(function (i) {
    var name = D.players[i].name;
    if (name.indexOf(t) >= 0) return true;
    if (onlyCho && chosung(name).indexOf(t) >= 0) return true;
    return false;
  });
}

function h2hPlayerBox(name, value) {
  var has = value !== '';
  return '<div class="h2hpick" data-f="' + name + '">' +
    '<input class="h2hsel h2hinput" type="text" autocomplete="off"' +
    ' placeholder="선수 이름 · 초성(ㄱㅌㅇ)도 됩니다"' +
    ' value="' + esc(has ? h2hPlayerLabel(+value) : '') + '">' +
    (has ? '<button class="h2hclear" type="button" title="지우기">×</button>' : '') +
    '<div class="h2hdrop" hidden></div></div>';
}

/** 선수 칸에 동작을 붙입니다. 고를 때만 화면을 다시 그립니다 —
    글자를 칠 때마다 다시 그리면 입력칸에서 커서가 튕겨 나갑니다. */
function wireH2HPick(box, onPick) {
  var input = box.querySelector('.h2hinput');
  var drop = box.querySelector('.h2hdrop');
  var clear = box.querySelector('.h2hclear');
  var hits = [], cur = -1, composing = false;

  function close() { drop.hidden = true; cur = -1; }

  function paint() {
    hits = h2hMatches(input.value);
    if (!hits.length) {
      drop.innerHTML = '<div class="h2hempty">일치하는 선수가 없습니다</div>';
    } else {
      drop.innerHTML = hits.map(function (i, n) {
        var p = D.players[i];
        return '<div class="h2hopt' + (n === cur ? ' on' : '') + '" data-i="' + i + '">' +
          '<span class="h2hoptname">' + esc(p.name) + '</span>' +
          '<span class="h2hoptrace r-' + p.race + '">' + p.race + '</span>' +
          '<span class="h2hoptnum">' + (p.setWin + p.setLoss) + '세트</span></div>';
      }).join('');
    }
    drop.hidden = false;
  }

  function pick(i) {
    input.value = h2hPlayerLabel(i);
    close();
    onPick(String(i));
  }

  function move(step) {
    if (drop.hidden) { paint(); return; }
    if (!hits.length) return;
    cur = (cur + step + hits.length) % hits.length;
    paint();
    var on = drop.querySelector('.h2hopt.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('focus', function () { cur = -1; paint(); });
  input.addEventListener('input', function () { if (!composing) { cur = -1; paint(); } });
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () {
    composing = false; cur = -1; paint();          // 한글 조합이 끝나면 다시 거릅니다
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Escape') { close(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (composing) return;                        // 한글 확정용 엔터는 넘깁니다
      if (!drop.hidden && hits.length) pick(hits[cur >= 0 ? cur : 0]);
    }
  });
  drop.addEventListener('mousedown', function (e) {   // blur 보다 먼저 잡습니다
    var opt = e.target.closest ? e.target.closest('.h2hopt') : null;
    if (opt) { e.preventDefault(); pick(+opt.dataset.i); }
  });
  input.addEventListener('blur', function () {
    setTimeout(function () {
      close();
      // 칸에 남은 글자가 어느 선수도 가리키지 않으면 지워서 '전체'로 돌립니다.
      var m = h2hMatches(input.value);
      if (input.value.trim() && m.length === 1) pick(m[0]);
      else if (!m.length || input.value.trim() === '') input.value = '';
    }, 120);
  });
  if (clear) {
    clear.addEventListener('mousedown', function (e) {
      e.preventDefault();
      input.value = '';
      onPick('');
    });
  }
}

function h2hSideMatch(pIdx, rIdx, wantP, wantR) {
  if (wantP !== '' && pIdx !== +wantP) return false;
  if (wantR !== '' && SL.races[rIdx] !== wantR) return false;
  return true;
}

/** 조건에 맞는 세트를 모아 A 쪽 기준으로 집계합니다. */
function h2hCollect() {
  var f = state.h2h;
  var out = {
    w: 0, l: 0, byMap: {}, byTour: {}, byOpp: {}, byMu: {}, sets: [],
    bothOpen: f.pa === '' && f.ra === '' && f.pb === '' && f.rb === ''
  };
  if (out.bothOpen) return out;
  for (var i = 0; i < SL.rows.length; i++) {
    var r = SL.rows[i];
    if (f.map !== '' && r[2] !== +f.map) continue;
    if (f.tour !== '' && r[3] !== +f.tour) continue;
    // 어느 쪽을 A 로 볼지 — 앞사람을 먼저 맞춰 보고, 안 되면 뒷사람을 봅니다.
    var fwd = h2hSideMatch(r[0], r[5], f.pa, f.ra) && h2hSideMatch(r[1], r[6], f.pb, f.rb);
    var rev = !fwd &&
      h2hSideMatch(r[1], r[6], f.pa, f.ra) && h2hSideMatch(r[0], r[5], f.pb, f.rb);
    if (!fwd && !rev) continue;
    var aI = fwd ? r[0] : r[1], bI = fwd ? r[1] : r[0];
    var aR = SL.races[fwd ? r[5] : r[6]], bR = SL.races[fwd ? r[6] : r[5]];
    var won = fwd ? r[7] === 0 : r[7] === 1;
    if (won) out.w++; else out.l++;
    bump(out.byMap, r[2], won);
    bump(out.byTour, r[3], won);
    bump(out.byOpp, bI, won);
    bump(out.byMu, aR + 'v' + bR, won);
    out.sets.push({ a: aI, b: bI, aR: aR, bR: bR, map: r[2], tour: r[3], rd: r[4], won: won });
  }
  return out;

  function bump(o, k, won) {
    var e = o[k] || (o[k] = [0, 0]);
    e[won ? 0 : 1]++;
  }
}

/** 두 선수를 콕 집었을 때만 — 세트가 아니라 '경기(매치)' 전적입니다. */
function h2hMatchRecord() {
  var f = state.h2h;
  if (f.pa === '' || f.pb === '') return null;
  var an = D.players[+f.pa].name, bn = D.players[+f.pb].name;
  var w = 0, l = 0, drawn = 0;
  D.matches.forEach(function (m) {
    if (m.players.indexOf(an) < 0 || m.players.indexOf(bn) < 0) return;
    if (f.tour !== '' && m.tournament !== D.tournaments[+f.tour].name) return;
    if (f.map !== '' && m.maps.indexOf(D.maps[+f.map].name) < 0) return;
    if (m.winner === an) w++;
    else if (m.winner === bn) l++;
    else drawn++;
  });
  return { w: w, l: l, drawn: drawn };
}

function h2hSideName(pKey, rKey, fallback) {
  var f = state.h2h;
  if (f[pKey] !== '') {
    var p = D.players[+f[pKey]];
    return raceBadge(p.race) + ' ' + esc(p.name);
  }
  if (f[rKey] !== '') return raceBadge(f[rKey]) + ' ' + RACE_LABEL[f[rKey]] + ' 전체';
  return '<span class="dim">' + fallback + '</span>';
}

function h2hTable(title, obj, labelOf, linkOf) {
  var keys = Object.keys(obj);
  if (!keys.length) return '';
  keys.sort(function (x, y) {
    return (obj[y][0] + obj[y][1]) - (obj[x][0] + obj[x][1]);
  });
  var body = keys.map(function (k) {
    var o = obj[k], lbl = labelOf(k);
    if (lbl === null) return '';
    return '<tr><td class="nm">' + (linkOf ? linkOf(k) : esc(lbl)) + '</td>' +
      '<td class="num"><b class="win">' + o[0] + '</b></td>' +
      '<td class="num"><b class="lose">' + o[1] + '</b></td>' +
      '<td class="num">' + (o[0] + o[1]) + '</td>' +
      '<td class="num pct">' + pct(o[0], o[1]) + '</td></tr>';
  }).join('');
  return '<div class="card"><div class="cardtitle">' + title + '</div>' +
    '<div class="tblwrap"><table><thead><tr>' +
    '<th class="static">구분</th><th class="static num">승</th>' +
    '<th class="static num">패</th><th class="static num">세트</th>' +
    '<th class="static num">승률</th></tr></thead><tbody>' + body +
    '</tbody></table></div></div>';
}

function renderH2H() {
  var f = state.h2h;
  var panel = document.createElement('div');
  panel.className = 'h2hpanel';
  var raceOpts = RACE_ORDER.map(function (r) { return [r, RACE_LABEL[r]]; });
  panel.innerHTML =
    '<div class="h2hside"><span class="h2hcap">한쪽</span>' +
    h2hPlayerBox('pa', f.pa) +
    h2hSel('ra', f.ra, raceOpts, '종족 전체') + '</div>' +
    '<div class="h2hvs">VS</div>' +
    '<div class="h2hside"><span class="h2hcap">상대</span>' +
    h2hPlayerBox('pb', f.pb) +
    h2hSel('rb', f.rb, raceOpts, '종족 전체') + '</div>' +
    '<div class="h2hside wide"><span class="h2hcap">맵 · 대회</span>' +
    h2hSel('map', f.map, D.maps.map(function (m, i) {
      return [i, m.name + ' (' + m.totalSets + ')'];
    }), '맵 전체') +
    h2hSel('tour', f.tour, D.tournaments.map(function (t, i) {
      return [i, t.name];
    }), '대회 전체') + '</div>' +
    '<div class="h2hside"><button class="btn h2hreset" type="button">비우기</button></div>';
  panel.querySelectorAll('select').forEach(function (el) {
    el.addEventListener('change', function () {
      state.h2h[el.dataset.f] = el.value;
      render();
    });
  });
  panel.querySelectorAll('.h2hpick').forEach(function (box) {
    wireH2HPick(box, function (idx) {
      if (String(state.h2h[box.dataset.f]) === String(idx)) return;
      state.h2h[box.dataset.f] = idx;
      render();
    });
  });
  panel.querySelector('.h2hreset').addEventListener('click', function () {
    state.h2h = { pa: '', pb: '', ra: '', rb: '', map: '', tour: '' };
    render();
  });
  view.appendChild(panel);

  var res = h2hCollect();
  var box = document.createElement('div');

  if (res.bothOpen) {
    box.innerHTML = '<div class="emptybox">양쪽에 선수나 종족을 하나 이상 골라 주세요.' +
      '<div class="hint" style="margin-top:8px">자주 찾는 맞대결</div>' +
      '<div class="chips h2hquick">' + D.rivalries.slice(0, 6).map(function (r) {
        return '<div class="chip" data-a="' + esc(r.a) + '" data-b="' + esc(r.b) + '">' +
          esc(r.a) + ' vs ' + esc(r.b) + '</div>';
      }).join('') + '</div></div>';
    box.querySelectorAll('[data-a]').forEach(function (c) {
      c.addEventListener('click', function () {
        D.players.forEach(function (p, i) {
          if (p.name === c.dataset.a) state.h2h.pa = String(i);
          if (p.name === c.dataset.b) state.h2h.pb = String(i);
        });
        render();
      });
    });
    view.appendChild(box);
    return;
  }

  var total = res.w + res.l;
  var mr = h2hMatchRecord();
  var scoreLine = total
    ? '<div class="h2hscore"><b class="win">' + res.w + '</b>' +
      '<span class="dim">승</span><span class="h2hdash">·</span>' +
      '<b class="lose">' + res.l + '</b><span class="dim">패</span>' +
      '<span class="h2hrate">' + pct(res.w, res.l) + '</span></div>'
    : '<div class="h2hscore dim">맞붙은 기록이 없습니다</div>';

  var head = '<div class="card h2hhead">' +
    '<div class="h2hnames">' + h2hSideName('pa', 'ra', '누구든') +
    '<span class="h2hvs2">vs</span>' + h2hSideName('pb', 'rb', '누구든') + '</div>' +
    scoreLine +
    (total ? '<div class="mubar h2hbar"><span style="width:' +
      pctNum(res.w, res.l) + '%"></span><span style="width:' +
      pctNum(res.l, res.w) + '%"></span></div>' : '') +
    (mr && (mr.w + mr.l + mr.drawn)
      ? '<div class="hint">경기(매치) 기준으로는 <b>' + mr.w + '승 ' + mr.l + '패</b>' +
        (mr.drawn ? ' · 진행 중 ' + mr.drawn : '') + ' 입니다. 위 숫자는 세트 기준입니다.</div>'
      : '') +
    '<div class="hint">세트 ' + total.toLocaleString() + '개를 셌습니다.</div>' +
    '</div>';

  var tables = '';
  if (f.pa !== '' && f.pb === '') {
    tables += h2hTable('상대 선수별', res.byOpp, function (k) {
      return D.players[+k].name;
    }, function (k) {
      var p = D.players[+k];
      return nameLink(p.name, p.race);
    });
  }
  tables += h2hTable('맵별', res.byMap, function (k) {
    return +k < 0 ? null : D.maps[+k].name;
  });
  tables += h2hTable('대회별', res.byTour, function (k) {
    return D.tournaments[+k].name;
  });
  if (Object.keys(res.byMu).length > 1) {
    tables += h2hTable('종족 대결별', res.byMu, function (k) {
      return RACE_LABEL[k[0]] + ' vs ' + RACE_LABEL[k[2]];
    });
  }

  var LIMIT = 300;
  var shown = res.sets.slice(0, LIMIT);
  var list = !shown.length ? '' :
    '<div class="card"><div class="cardtitle">세트 기록' +
    (res.sets.length > LIMIT ? ' <span class="dim">(' + LIMIT + '개만 보임 · 전체 ' +
      res.sets.length.toLocaleString() + ')</span>' : '') + '</div>' +
    '<div class="tblwrap"><table><thead><tr>' +
    '<th class="static">대회</th><th class="static">라운드</th>' +
    '<th class="static">맵</th><th class="static">한쪽</th>' +
    '<th class="static">상대</th><th class="static num">결과</th>' +
    '</tr></thead><tbody>' + shown.map(function (s) {
      return '<tr><td class="dim">' + esc(D.tournaments[s.tour].short) + '</td>' +
        '<td class="dim">' + esc(SL.rounds[s.rd] || '') + '</td>' +
        '<td>' + (s.map < 0 ? '<span class="dim">-</span>' : esc(D.maps[s.map].name)) + '</td>' +
        '<td class="nm">' + raceBadge(s.aR) + ' ' + esc(D.players[s.a].name) + '</td>' +
        '<td class="nm">' + raceBadge(s.bR) + ' ' + esc(D.players[s.b].name) + '</td>' +
        '<td class="num"><b class="' + (s.won ? 'win' : 'lose') + '">' +
        (s.won ? '승' : '패') + '</b></td></tr>';
    }).join('') + '</tbody></table></div></div>';

  box.innerHTML = head + tables + list;
  view.appendChild(box);
}

/* ── 라우팅 ────────────────────────────────────────────────── */
function render() {
  renderTabs();
  writeHash();
  view.innerHTML = '';
  if (state.tab === 'season') renderSeason();
  else if (state.tab === 'rank') renderRank();
  else if (state.tab === 'mu') renderMu();
  else if (state.tab === 'roster') renderRoster();
  else if (state.tab === 'maps') renderMaps();
  else if (state.tab === 'matches') renderMatches();
  else if (state.tab === 'h2h') renderH2H();
  else if (state.tab === 'records') renderRecords();
}

window.addEventListener('hashchange', function () { readHash(); render(); });
readHash();
render();

$('#built').textContent = new Date(D.builtAt).toLocaleString('ko-KR');
</script>
</body>
</html>
