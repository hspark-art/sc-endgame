<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스타크래프트 끝장전 기록실</title>
<link rel="icon" href="https://stimg.sooplive.com/LOGO/ta/talent/m/talent.webp">
<style>
  :root{--bg:#0a0d13;--panel:#141821;--panel2:#1b202b;--line:#232a38;
    --txt:#e8ecf3;--dim:#8a93a6;--accent:#1c8cff;--gold:#ffb020;--win:#4ade80;--lose:#f87171;
    --t:#4a9eff;--p:#f5c518;--z:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;font-size:14px}
  a{color:inherit;text-decoration:none}
  .brandbar{height:4px;background:linear-gradient(90deg,var(--t) 0%,var(--accent) 35%,var(--gold) 70%,var(--z) 100%)}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 80px}
  header{padding-bottom:18px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
  header::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.06;
    background-image:repeating-linear-gradient(115deg,var(--accent) 0 2px,transparent 2px 26px);
    -webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
  .headrow{display:flex;align-items:center;gap:14px;position:relative}
  .brandlogo{width:48px;height:48px;border-radius:50%;object-fit:cover;
    border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(28,140,255,.15)}
  h1{margin:0;font-size:26px;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .stats-strip{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
  .stats-strip .item{color:var(--dim);font-size:12.5px}
  .stats-strip b{color:var(--txt);font-size:15px;display:block;font-variant-numeric:tabular-nums}

  .tabs{display:flex;gap:6px;margin:20px 0 14px;flex-wrap:wrap}
  .tab{padding:8px 15px;border-radius:8px;background:var(--panel);color:var(--dim);
    cursor:pointer;font-weight:600;font-size:13px;border:1px solid transparent}
  .tab:hover{color:var(--txt)}
  .tab.on{color:#fff;background:linear-gradient(135deg,var(--accent),#0d5fc4);
    box-shadow:0 2px 10px rgba(28,140,255,.35)}

  .chips{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .chip{padding:5px 12px;border-radius:999px;background:var(--panel);color:var(--dim);
    cursor:pointer;font-weight:700;font-size:12px;border:1px solid var(--line)}
  .chip.on{color:#fff;background:var(--accent);border-color:var(--accent)}

  input.search{width:100%;max-width:280px;padding:8px 12px;border-radius:8px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:13px;margin-bottom:12px}
  input.search::placeholder{color:var(--dim)}
  input.search:focus{outline:none;border-color:var(--accent)}

  table{width:100%;border-collapse:collapse}
  th{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.05em;
    border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;cursor:pointer;white-space:nowrap}
  th:hover{color:var(--txt)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  td{padding:11px 10px;border-bottom:1px solid #171c25;font-size:13px;white-space:nowrap}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tblwrap table{min-width:100%}
  tr.rowlink{cursor:pointer}
  tr.rowlink:hover{background:rgba(28,140,255,.07)}
  .rk{color:var(--dim);width:34px;display:inline-block}
  .race{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:5px;
    font-size:11px;font-weight:800;text-align:center;color:#0b0d11;margin-right:8px}
  .race.T{background:var(--t)} .race.P{background:var(--p)} .race.Z{background:var(--z)}
  .nm{font-weight:700}
  .win{color:var(--win);font-weight:700}
  .lose{color:var(--lose)}
  .nm-link{cursor:pointer}
  .nm-link:hover{text-decoration:underline;text-decoration-color:var(--accent)}
  .score-cell{cursor:pointer}
  .spoiler{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--panel2);
    color:var(--dim);border:1px dashed var(--line);font-size:11px;font-weight:700;white-space:nowrap}
  .spoiler:hover{border-color:var(--accent);color:var(--accent)}
  .pct{color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--accent);
    border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .backlink{display:inline-block;margin-bottom:12px;color:var(--accent);font-weight:700;cursor:pointer}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .muted{color:var(--dim);font-size:12px}

  /* 라이브 배너 */
  .livecard{margin:18px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
  .livecard.live{border-color:#ff4d4d}
  .live-head{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
  .live-dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block}
  .livecard.live .live-dot{background:#ff4d4d;box-shadow:0 0 0 0 rgba(255,77,77,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.5)}70%{box-shadow:0 0 0 8px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
  .live-badge{font-size:11px;font-weight:800;letter-spacing:.05em;color:#ff4d4d}
  .live-title{font-weight:700;font-size:14px;flex:1;min-width:120px}
  .live-viewer{color:var(--dim);font-size:12px}
  .live-body{position:relative;background:#000}
  .live-thumb-link{display:block;position:relative}
  .live-thumb{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#000}
  .live-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,.1));color:#fff;font-weight:700;font-size:13px;
    opacity:0;transition:opacity .15s}
  .live-thumb-link:hover .live-play{opacity:1}
  .live-off{padding:22px 16px;text-align:center;color:var(--dim);font-size:13px}
  .live-off a{color:var(--accent);font-weight:700}

  .linkbanner{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 6px}
  .linkbtn{flex:1;min-width:150px;padding:12px 14px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);text-align:center;font-weight:700;font-size:13px;color:var(--txt)}
  .linkbtn:hover{border-color:var(--accent);color:var(--accent)}
  .linkbtn .sub2{display:block;font-weight:500;color:var(--dim);font-size:11px;margin-top:3px}
  .linkbtn.yt{background:linear-gradient(135deg,#3a0a0a,var(--panel));border-color:#5c1414}
  .linkbtn.yt:hover{border-color:#ff3b3b;color:#ff5c5c}
  .linkbtn.yt .yt-ico{color:#ff3b3b}

  .yt-mini{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;
    background:rgba(255,59,59,.1);border:1px solid rgba(255,59,59,.35);color:#ff5c5c;
    font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer}
  .yt-mini:hover{background:rgba(255,59,59,.2);border-color:#ff3b3b;color:#ff8080}
  .yt-mini.yt-fallback{background:var(--panel2);border-color:var(--line);color:var(--dim)}
  .yt-mini.yt-fallback:hover{border-color:var(--accent);color:var(--accent)}

  /* 영상 바로재생 모달 — 클릭 즉시 사이트 안에서 재생, 유튜브로 이탈 안 함 */
  .vmodal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
    align-items:center;justify-content:center;z-index:999;padding:20px}
  .vmodal.on{display:flex}
  .vmodal-box{width:100%;max-width:920px;background:#000;border-radius:10px;overflow:hidden;
    border:1px solid var(--line);position:relative}
  .vmodal-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
  .vmodal-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vmodal-close{position:absolute;top:-38px;right:0;background:none;border:0;color:#fff;
    font-size:14px;font-weight:800;cursor:pointer;padding:8px 4px}
  .vmodal-close:hover{color:#ff5c5c}

  footer{margin-top:36px;color:var(--dim);font-size:12px;text-align:center;
    border-top:1px solid var(--line);padding-top:16px;line-height:1.8}
  @media(max-width:860px){
    .wrap{padding:16px 12px 60px}
    th.hide-mobile,td.hide-mobile{display:none}
  }
</style>
</head>

  ['기간', D.global.firstDate + ' ~ ' + D.global.lastDate],
].map(([k,v]) => '<div class="item">'+k+'<b>'+v+'</b></div>').join('');

// ── 라이브 방송 배너 ──────────────────────────────────────────
// SOOP(구 아프리카TV)의 공개 station API 로 지금 방송 중인지 확인합니다.
// 인증이 필요 없고, 로그인 없이 누구나 조회 가능한 엔드포인트입니다.
// 방송 번호(broad_no)는 방송할 때마다 바뀌므로 절대 하드코딩하지 않고
// 매번 이 API 로 새로 받아옵니다 — 그래서 "방송 시작 → 자동 연동" 이 됩니다.
const SOOP_BJID = 'talent';
const SOOP_STATION_URL = 'https://www.sooplive.com/station/talent';
const liveBannerEl = $('#liveBanner');

function renderLiveOffline(){
  liveBannerEl.innerHTML = '<div class="livecard"><div class="live-head">'
    + '<span class="live-dot"></span><span class="live-badge" style="color:var(--dim)">OFF AIR</span>'
    + '</div><div class="live-off">지금은 방송 중이 아닙니다 — '
    + '<a href="'+SOOP_STATION_URL+'" target="_blank" rel="noopener">SOOP 방송국에서 방송 알림 받기</a></div></div>';
}

function renderLiveOnline(broadNo, title, viewers){
  const liveUrl = 'https://play.sooplive.com/'+SOOP_BJID+'/'+broadNo;
  const thumb = 'https://liveimg.sooplive.com/h/'+broadNo+'.webp?t='+Date.now();
  liveBannerEl.innerHTML = '<div class="livecard live">'
    + '<div class="live-head"><span class="live-dot"></span><span class="live-badge">LIVE</span>'
    + '<span class="live-title">'+esc(title||'끝장전 생방송 중')+'</span>'
    + (viewers ? '<span class="live-viewer">👁 '+Number(viewers).toLocaleString()+'명 시청 중</span>' : '')
    + '</div>'
    + '<a class="live-thumb-link" href="'+liveUrl+'" target="_blank" rel="noopener">'
    + '<img class="live-thumb" src="'+thumb+'" alt="방송 미리보기" loading="eager">'
    + '<div class="live-play">▶ SOOP에서 바로 시청하기</div>'
    + '</a></div>';
}

async function checkLiveStatus(){
  try {
    const res = await fetch('https://bjapi.afreecatv.com/api/'+SOOP_BJID+'/station', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const d = await res.json();
    const broadNo = d && d.broad && Number(d.broad.broad_no);
    if (broadNo) {
      renderLiveOnline(broadNo, d.broad.broad_title, d.broad.current_sum_viewer);
    } else {
      renderLiveOffline();
    }
  } catch (e) {
    // 조회 실패 시에는 배너를 아예 숨깁니다 (틀린 정보를 보여주지 않기 위해).
    liveBannerEl.innerHTML = '';
  }
}

checkLiveStatus();
setInterval(checkLiveStatus, 60000); // 60초마다 다시 확인 — 방송 시작하면 페이지 새로고침 없이 자동 반영

// ── 영상 바로재생 모달 ────────────────────────────────────────
// "▶ 영상 보기"를 눌렀을 때 유튜브로 이탈시키지 않고, 그 자리에서 바로 재생합니다
// (카톡 요청 — "영상마다 따로 들어가자마자 볼 수 있게"). autoplay=1 로 클릭 즉시 재생.
function extractYoutubeId(url){
  const m = String(url||'').match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const vmodalEl = $('#vmodal');
const vmodalFrameEl = $('#vmodalFrame');
function openVideoModal(url){
  const id = extractYoutubeId(url);
  if (!id) { window.open(url, '_blank', 'noopener'); return; }
  vmodalFrameEl.innerHTML = '<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0" '
    + 'title="다시보기" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  vmodalEl.classList.add('on');
}
function closeVideoModal(){
  vmodalEl.classList.remove('on');
  vmodalFrameEl.innerHTML = ''; // iframe 제거 — 모달 닫으면 재생도 바로 멈춤
}
$('#vmodalClose').addEventListener('click', closeVideoModal);
vmodalEl.addEventListener('click', (e) => { if (e.target === vmodalEl) closeVideoModal(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideoModal(); });

const TABS = [
  { id:'rank', label:'선수 랭킹' },
  { id:'roster', label:'선수 명단' },
  { id:'maps', label:'맵 통계' },
  { id:'recent', label:'최근 경기' },
];

let state = { tab:'rank', race:'ALL', sortKey:'matchWin', sortDir:-1, q:'' };

function setTab(id){ state.tab=id; state.q=''; render(); }
function renderTabs(){
  tabsEl.innerHTML = TABS.map(t =>
    '<div class="tab '+(state.tab===t.id?'on':'')+'" data-tab="'+t.id+'">'+t.label+'</div>'
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(el =>
    el.addEventListener('click', () => setTab(el.dataset.tab)));
}

function raceChips(current, onPick){
  const opts = [['ALL','전체'],['T','테란'],['P','프로토스'],['Z','저그']];
  const html = '<div class="chips">' + opts.map(([k,l]) =>
    '<div class="chip '+(current===k?'on':'')+'" data-race="'+k+'">'+l+'</div>').join('') + '</div>';
  const holder = document.createElement('div');
  holder.innerHTML = html;
  holder.querySelectorAll('.chip').forEach(el =>
    el.addEventListener('click', () => onPick(el.dataset.race)));
  return holder.firstChild ? holder : holder;
}

function sortRows(rows, key, dir){
  return rows.slice().sort((a,b) => {
    const av = a[key], bv = b[key];
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return ((av||0) - (bv||0)) * dir;
  });
}

function renderRank(){
  const wrap = document.createElement('div');
  const chipRow = document.createElement('div');
  chipRow.className = 'chips';
  chipRow.innerHTML = ['ALL','T','P','Z'].map(k =>
    '<div class="chip '+(state.race===k?'on':'')+'" data-race="'+k+'">'+(k==='ALL'?'전체':RACE_LABEL[k])+'</div>').join('');
  chipRow.querySelectorAll('.chip').forEach(el => el.addEventListener('click', () => { state.race = el.dataset.race; render(); }));
  wrap.appendChild(chipRow);

  const input = document.createElement('input');
  input.className = 'search'; input.placeholder = '선수 이름 검색...'; input.value = state.q;
  input.addEventListener('input', () => { state.q = input.value; renderRankTable(table); });
  wrap.appendChild(input);

  const table = document.createElement('div');
  wrap.appendChild(table);
  view.appendChild(wrap);
  renderRankTable(table);
}

function renderRankTable(container){
  let rows = D.players.filter(p => state.race==='ALL' || p.race===state.race);
  if (state.q) rows = rows.filter(p => p.name.includes(state.q));
  rows = sortRows(rows, state.sortKey, state.sortDir);

  const cols = [
    ['name','선수',''], ['matchWin','매치','num'], ['setWin','세트','num'],
    ['appearances','출전','num'], ['lastDate','최근 출전','num hide-mobile'],
  ];
  const head = '<tr>' + cols.map(([k,label,cls]) =>
    '<th class="'+(cls||'')+'" data-key="'+k+'">'+label+(state.sortKey===k?(state.sortDir>0?' ▲':' ▼'):'')+'</th>').join('') + '</tr>';

  const body = rows.map((p,i) => {
    const matchPct = pct(p.matchWin, p.matchLoss);
    const setPct = pct(p.setWin, p.setLoss);
    return '<tr class="rowlink" data-player="'+esc(p.name)+'">'
      + '<td><span class="rk">'+(i+1)+'</span>'+raceBadge(p.race)+'<span class="nm">'+esc(p.name)+'</span></td>'
      + '<td class="num">'+p.matchWin+'-'+p.matchLoss+' <span class="pct">'+matchPct+'</span></td>'
      + '<td class="num">'+p.setWin+'-'+p.setLoss+' <span class="pct">'+setPct+'</span></td>'
      + '<td class="num">'+p.appearances+'</td>'
      + '<td class="num hide-mobile">'+(p.lastDate||'-')+'</td>'
      + '</tr>';
  }).join('');

  container.innerHTML = '<div class="tblwrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  container.querySelectorAll('th[data-key]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.key;
    if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = -1; }
    renderRankTable(container);
  }));
  container.querySelectorAll('tr[data-player]').forEach(el => el.addEventListener('click', () => {
    location.hash = 'player/' + encodeURIComponent(el.dataset.player);
  }));
}

function renderRoster(){
  const wrap = document.createElement('div');
  ['T','P','Z'].forEach(race => {
    const list = D.players.filter(p => p.race===race).sort((a,b)=>b.appearances-a.appearances);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<div class="nm" style="margin-bottom:8px">'+raceBadge(race)+RACE_LABEL[race]+' <span class="muted">'+list.length+'명</span></div>'
      + '<div class="tblwrap"><table><thead><tr><th>선수</th><th class="num">출전</th><th class="num">전적</th><th class="num hide-mobile">최근 출전</th></tr></thead><tbody>'
      + list.map(p => '<tr class="rowlink" data-player="'+esc(p.name)+'">'
        + '<td class="nm">'+esc(p.name)+'</td>'
        + '<td class="num">'+p.appearances+'</td>'
        + '<td class="num">'+p.matchWin+'승 '+p.matchLoss+'패</td>'
        + '<td class="num hide-mobile">'+(p.lastDate||'-')+'</td></tr>').join('')
      + '</tbody></table></div>';
    wrap.appendChild(card);
  });
  view.appendChild(wrap);
  view.querySelectorAll('tr[data-player]').forEach(el => el.addEventListener('click', () => {
    location.hash = 'player/' + encodeURIComponent(el.dataset.player);
  }));
}

function renderMaps(){
  const wrap = document.createElement('div');
  const table = document.createElement('div');
  wrap.appendChild(table);
  view.appendChild(wrap);

  const rows = sortRows(D.maps, 'totalSets', -1);
  const head = '<tr><th>맵</th><th class="num">총 세트</th><th class="num hide-mobile">사용일수</th>'
    + '<th class="num">저그vs프로토스</th><th class="num">테란vs저그</th><th class="num">프로토스vs테란</th></tr>';
  const body = rows.map(m => {
    const zp = m.matchup['Z-P'], tz = m.matchup['T-Z'], pt = m.matchup['P-T'];
    const cell = (o,a,b) => (o.w+o.l) ? (o.w+'-'+o.l+' <span class="pct">('+a+' '+pct(o.w,o.l)+')</span>') : '-';
    return '<tr><td class="nm">'+esc(m.name)+'</td><td class="num">'+m.totalSets+'</td>'
      + '<td class="num hide-mobile">'+m.daysUsed+'</td>'
      + '<td class="num">'+cell(zp,'Z')+'</td>'
      + '<td class="num">'+cell(tz,'T')+'</td>'
      + '<td class="num">'+cell(pt,'P')+'</td></tr>';
  }).join('');
  table.innerHTML = '<div class="tblwrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="muted" style="margin-top:8px">괄호는 앞에 표시된 종족의 승률입니다.</div>';
}

function renderRecent(){
  const wrap = document.createElement('div');
  const table = document.createElement('div');
  wrap.appendChild(table);
  view.appendChild(wrap);

  const rows = D.matches.slice(0, 150);
  const head = '<tr><th>날짜</th><th>대진</th><th class="num">결과</th><th>다시보기</th></tr>';
  const body = rows.map(m => {
    const [a,b] = m.players;
    const aWin = m.winner===a;
    const ytQuery = encodeURIComponent(a + ' ' + b);
    const searchUrl = 'https://www.youtube.com/@ETALENT-TV/search?query=' + ytQuery;
    const ytCell = m.youtubeUrl
      ? '<span class="yt-mini" data-yt-play="'+esc(m.youtubeUrl)+'">▶ 바로재생</span>'
      : '<a class="yt-mini yt-fallback" href="'+searchUrl+'" target="_blank" rel="noopener">🔍 채널에서 찾기</a>';
    return '<tr>'
      + '<td class="muted">'+m.date+'</td>'
      + '<td>'+raceBadge(m.race[a])+'<span class="nm-link" data-player="'+esc(a)+'" data-win="'+(aWin?1:0)+'">'+esc(a)+'</span>'
      + ' <span class="muted">vs</span> '
      + raceBadge(m.race[b])+'<span class="nm-link" data-player="'+esc(b)+'" data-win="'+(!aWin?1:0)+'">'+esc(b)+'</span></td>'
      + '<td class="num score-cell">'
        + '<span class="spoiler">경기 결과 보기</span>'
        + '<span class="score-value" style="display:none">'+m.setWins[a]+' - '+m.setWins[b]+'</span>'
      + '</td>'
      + '<td>'+ytCell+'</td></tr>';
  }).join('');
  const matchedCount = rows.filter(m => m.youtubeUrl).length;
  table.innerHTML = '<div class="tblwrap"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="muted" style="margin-top:8px">최근 '+rows.length+'경기만 표시합니다 ('+matchedCount+'개 영상 자동 매칭). '
    + '선수 이름을 클릭하면 해당 선수 기록으로, "경기 결과 보기"를 클릭하면 스코어가 나옵니다. '
    + '"바로재생"은 페이지를 벗어나지 않고 그 자리에서 바로 재생됩니다. '
    + '"채널에서 찾기"는 정확한 매칭 영상을 찾지 못해 두 선수 이름으로 검색한 결과로 대신 이동합니다.</div>';

  function reveal(cell){
    const row = cell.closest('tr');
    cell.querySelector('.spoiler').style.display = 'none';
    cell.querySelector('.score-value').style.display = '';
    row.querySelectorAll('[data-player]').forEach(el => {
      el.classList.add(el.dataset.win === '1' ? 'win' : 'lose');
    });
  }

  table.querySelectorAll('.score-cell').forEach(cell => cell.addEventListener('click', (e) => {
    e.stopPropagation();
    reveal(cell);
  }));

  table.querySelectorAll('[data-player]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    location.hash = 'player/' + encodeURIComponent(el.dataset.player);
  }));

  table.querySelectorAll('[data-yt-play]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    openVideoModal(el.dataset.ytPlay);
  }));
}

function renderPlayer(name){
  const p = D.players.find(x => x.name === name);
  if (!p) { view.innerHTML = '<div class="card">선수를 찾을 수 없습니다.</div>'; return; }

  const back = document.createElement('div');
  back.className = 'backlink';
  back.textContent = '← 랭킹으로';
  back.addEventListener('click', () => { location.hash = ''; });
  view.appendChild(back);

  const head = document.createElement('div');
  head.className = 'card';
  head.innerHTML = '<div style="font-size:20px;font-weight:800">'+raceBadge(p.race)+esc(p.name)+'</div>'
    + '<div class="stats-strip" style="margin-top:12px">'
    + ['매치 '+p.matchWin+'승 '+p.matchLoss+'패 ('+pct(p.matchWin,p.matchLoss)+')',
       '세트 '+p.setWin+'승 '+p.setLoss+'패 ('+pct(p.setWin,p.setLoss)+')',
       '출전 '+p.appearances+'경기',
       '최근 출전 '+(p.lastDate||'-')]
      .map(t => '<div class="item">'+t+'</div>').join('')
    + '</div>';
  view.appendChild(head);

  const vsCard = document.createElement('div');
  vsCard.className = 'card';
  vsCard.innerHTML = '<div class="nm" style="margin-bottom:8px">종족별 세트 전적</div>'
    + '<div class="tblwrap"><table><thead><tr><th>상대 종족</th><th class="num">승-패</th><th class="num">승률</th></tr></thead><tbody>'
    + ['T','P','Z'].map(r => '<tr><td>'+raceBadge(r)+RACE_LABEL[r]+'</td>'
      + '<td class="num">'+p.vsRace[r].w+'-'+p.vsRace[r].l+'</td>'
      + '<td class="num">'+pct(p.vsRace[r].w,p.vsRace[r].l)+'</td></tr>').join('')
    + '</tbody></table></div>';
  view.appendChild(vsCard);

  const oppCard = document.createElement('div');
  oppCard.className = 'card';
  oppCard.innerHTML = '<div class="nm" style="margin-bottom:8px">상대 전적</div>'
    + '<div class="tblwrap"><table><thead><tr><th>상대</th><th class="num">세트 승-패</th><th class="num">승률</th><th class="num hide-mobile">매치수</th></tr></thead><tbody>'
    + p.vsPlayers.map(o => '<tr><td>'+raceBadge(o.race)+'<span class="nm-link" data-player="'+esc(o.name)+'">'+esc(o.name)+'</span></td>'
      + '<td class="num">'+o.w+'-'+o.l+'</td>'
      + '<td class="num">'+pct(o.w,o.l)+'</td>'
      + '<td class="num hide-mobile">'+o.matches.length+'</td></tr>').join('')
    + '</tbody></table></div>';
  view.appendChild(oppCard);
  oppCard.querySelectorAll('[data-player]').forEach(el => el.addEventListener('click', () => {
    location.hash = 'player/' + encodeURIComponent(el.dataset.player);
  }));

  const recentCard = document.createElement('div');
  recentCard.className = 'card';
  const recentMatches = D.matches.filter(m => m.players.includes(p.name)).slice(0, 20);
  recentCard.innerHTML = '<div class="nm" style="margin-bottom:8px">최근 경기</div>'
    + '<div class="tblwrap"><table><thead><tr><th>날짜</th><th>상대</th><th class="num">스코어</th></tr></thead><tbody>'
    + recentMatches.map(m => {
        const opp = m.players.find(x => x !== p.name);
        const win = m.winner === p.name;
        return '<tr><td class="muted">'+m.date+'</td>'
          + '<td>'+raceBadge(m.race[opp])+'<span class="nm-link" data-player="'+esc(opp)+'">'+esc(opp)+'</span></td>'
          + '<td class="num '+(win?'win':'lose')+'">'+m.setWins[p.name]+'-'+m.setWins[opp]+'</td></tr>';
      }).join('')
    + '</tbody></table></div>';
  view.appendChild(recentCard);
  recentCard.querySelectorAll('[data-player]').forEach(el => el.addEventListener('click', () => {
    location.hash = 'player/' + encodeURIComponent(el.dataset.player);
  }));
}

function render(){
  renderTabs();
  view.innerHTML = '';
  const hash = location.hash.replace(/^#/, '');
  if (hash.startsWith('player/')) {
    renderPlayer(decodeURIComponent(hash.slice('player/'.length)));
    return;
  }
  if (state.tab === 'rank') renderRank();
  else if (state.tab === 'roster') renderRoster();
  else if (state.tab === 'maps') renderMaps();
  else if (state.tab === 'recent') renderRecent();
}

window.addEventListener('hashchange', render);
render();

$('#foot').innerHTML = '데이터 출처: 방송팀이 직접 기록한 구글시트(끝장전 데이터).'
  + ' 표시된 값은 시트의 세트 단위 원본 기록을 그대로 다시 계산한 것입니다.'
  + '<br>마지막 갱신: ' + new Date(D.builtAt).toLocaleString('ko-KR');
</script>
